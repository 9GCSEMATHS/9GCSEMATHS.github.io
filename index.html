<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>GCSE Study Hub</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17213a;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-height: 100vh; }

    button, a { font: inherit; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      padding: 0 7vw;
      background: #fff;
      border-bottom: 1px solid #e8ebf2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 11px;
      color: #fff;
      background: #5548e8;
      font-size: 18px;
      font-weight: 800;
    }

    .topbar-label { color: #7b8498; font-size: 13px; }

    main {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 76px 0 56px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #5548e8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 56px);
      letter-spacing: -0.055em;
      line-height: 1.05;
    }

    .intro {
      max-width: 520px;
      margin: 17px 0 38px;
      color: #68738a;
      font-size: 16px;
      line-height: 1.65;
    }

    .section-heading {
      margin: 0 0 15px;
      color: #7b8498;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .subject-card {
      display: flex;
      width: min(100%, 340px);
      min-height: 116px;
      align-items: center;
      gap: 18px;
      padding: 22px;
      border: 1px solid #e6e9f1;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 26px rgb(34 44 82 / 5%);
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .subject-card:hover, .subject-card:focus-visible {
      transform: translateY(-2px);
      border-color: #b9b3ff;
      box-shadow: 0 14px 32px rgb(34 44 82 / 10%);
      outline: none;
    }

    .subject-icon {
      display: grid;
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 16px;
      background: #eeedff;
      color: #5548e8;
      font-size: 28px;
      font-weight: 750;
    }

    .subject-name { display: block; font-size: 18px; font-weight: 750; }
    .subject-detail { display: block; margin-top: 5px; color: #7b8498; font-size: 13px; }
    .card-arrow { margin-left: auto; color: #9aa2b3; font-size: 22px; }

    .paper-view { padding-top: 32px; }

    .paper-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #e1e5ef;
      border-radius: 10px;
      background: #fff;
      color: #303b54;
      cursor: pointer;
      font-weight: 650;
    }

    .paper-title { margin: 0; font-size: clamp(19px, 3vw, 25px); letter-spacing: -0.03em; }

    .open-link {
      color: #5548e8;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .open-link:hover { text-decoration: underline; }

    .pdf-frame {
      display: block;
      width: 100%;
      height: min(76vh, 900px);
      min-height: 520px;
      border: 1px solid #e1e5ef;
      border-radius: 14px;
      background: #e9ecf3;
      box-shadow: 0 12px 36px rgb(34 44 82 / 8%);
    }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      .topbar { min-height: 66px; padding: 0 20px; }
      .topbar-label { font-size: 12px; }
      main { padding-top: 54px; }
      .paper-toolbar { align-items: flex-start; flex-wrap: wrap; }
      .paper-title { order: 2; width: 100%; }
      .open-link { margin: 10px 0 0 auto; }
      .pdf-frame { min-height: 65vh; height: 65vh; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="home-link" aria-label="GCSE Study Hub home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span>GCSE Study Hub</span>
    </a>
    <span class="topbar-label">Your revision, in one place</span>
  </header>

  <main>
    <section id="subjects" aria-labelledby="welcome-heading">
      <p class="eyebrow">Study dashboard</p>
      <h1 id="welcome-heading">What are you studying?</h1>
      <p class="intro">Choose a subject to open your revision materials.</p>
      <h2 class="section-heading">Your subjects</h2>
      <button class="subject-card" id="maths-button" type="button" aria-label="Open Maths">
        <span class="subject-icon" aria-hidden="true">∑</span>
        <span>
          <span class="subject-name">Maths</span>
          <span class="subject-detail">June 2026 · Paper 2</span>
        </span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </button>
    </section>

    <section class="paper-view" id="paper-view" aria-labelledby="paper-title" hidden>
      <div class="paper-toolbar">
        <button class="back-button" id="back-button" type="button"><span aria-hidden="true">←</span> Subjects</button>
        <h1 class="paper-title" id="paper-title">Maths — June 2026 Paper 2</h1>
        <a class="open-link" href="Exdecel%20June%202026%20Paper%202%20Questions.pdf" target="_blank" rel="noopener">Open PDF in new tab ↗</a>
      </div>
      <iframe
        class="pdf-frame"
        id="pdf-frame"
        title="Exdecel June 2026 Paper 2 Questions"
        src="Exdecel%20June%202026%20Paper%202%20Questions.pdf"
      ></iframe>
    </section>
  </main>

  <script>
    const subjects = document.getElementById("subjects");
    const paperView = document.getElementById("paper-view");
    const mathsButton = document.getElementById("maths-button");
    const backButton = document.getElementById("back-button");
    const homeLink = document.getElementById("home-link");

    function showSubjects() {
      paperView.hidden = true;
      subjects.hidden = false;
      document.title = "GCSE Study Hub";
    }

    function showMathsPaper() {
      subjects.hidden = true;
      paperView.hidden = false;
      document.title = "Maths — June 2026 Paper 2 | GCSE Study Hub";
    }

    mathsButton.addEventListener("click", showMathsPaper);
    backButton.addEventListener("click", showSubjects);
    homeLink.addEventListener("click", (event) => {
      event.preventDefault();
      showSubjects();
    });
  </script>
</body>
</html>
